controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController
left_arm_controller:
  ros__parameters:
    joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4, openarm_left_joint5, openarm_left_joint6, openarm_left_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
right_arm_controller:
  ros__parameters:
    joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4, openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
left_hand_controller:
  ros__parameters:
    joints: [left_hand_joint_1_1, left_hand_joint_1_2, left_hand_joint_1_3, left_hand_joint_1_4, left_hand_joint_2_1, left_hand_joint_2_2, left_hand_joint_2_3, left_hand_joint_2_4, left_hand_joint_3_1, left_hand_joint_3_2, left_hand_joint_3_3, left_hand_joint_3_4, left_hand_joint_4_1, left_hand_joint_4_2, left_hand_joint_4_3, left_hand_joint_4_4, left_hand_joint_5_1, left_hand_joint_5_2, left_hand_joint_5_3, left_hand_joint_5_4]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
right_hand_controller:
  ros__parameters:
    joints: [right_hand_joint_1_1, right_hand_joint_1_2, right_hand_joint_1_3, right_hand_joint_1_4, right_hand_joint_2_1, right_hand_joint_2_2, right_hand_joint_2_3, right_hand_joint_2_4, right_hand_joint_3_1, right_hand_joint_3_2, right_hand_joint_3_3, right_hand_joint_3_4, right_hand_joint_4_1, right_hand_joint_4_2, right_hand_joint_4_3, right_hand_joint_4_4, right_hand_joint_5_1, right_hand_joint_5_2, right_hand_joint_5_3, right_hand_joint_5_4]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
